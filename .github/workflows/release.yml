name: Release

# Tagged release workflow. On any push to a `v*` tag, build the tai
# bash binary for each supported platform and publish a GitHub
# Release with the assets attached. Tag PEP-440 pre-release suffixes
# (a / b / rc) get marked as pre-releases automatically.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # required for softprops/action-gh-release to upload assets

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS build: universal2 (arm64 + x86_64 fat binary)
          # on the Apple Silicon runner. We drove this in via plain
          # `-arch' flags in CFLAGS+LDFLAGS — bash's autoconf does
          # mostly preprocessor / link tests (arch-invariant on
          # macOS) and the few AC_TRY_RUN probes execute the fat
          # binary's arm64 slice on the build host. Apple has
          # shipped bash as fat-binary in macOS for years, so the
          # codebase is well-validated for this approach.
          #
          # Avoids the macos-13 (Intel) GHA runner queue starvation
          # that was blocking releases.
          - runner: macos-14
            target: macos-universal2
            artifact: tai-macos-universal2
          - runner: ubuntu-latest
            target: linux-x86_64
            artifact: tai-linux-x86_64
            builder: native
          # musl build for Alpine-based environments (notably the
          # c2w-net Docker container that the desktop SPA ships with).
          # Built inside an alpine:3.19 container on the ubuntu runner
          # so the resulting binary links against musl, not glibc.
          - runner: ubuntu-latest
            target: linux-x86_64-musl
            artifact: tai-linux-x86_64-musl
            builder: alpine

    steps:
      - uses: actions/checkout@v4

      # macOS GitHub runners ship Apple's ancient `bison 2.3', which
      # is too old to process bash 5.3's parse.y (it pre-dates the
      # `YYEOF' token reference and bails with `symbol YYEOF is used,
      # but is not defined as a token and has no rules'). Install
      # Homebrew's modern bison and put it at the front of PATH.
      - name: Install modern bison (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison
          BISON_DIR="$(brew --prefix bison)/bin"
          echo "${BISON_DIR}" >> "$GITHUB_PATH"
          "${BISON_DIR}/bison" --version | head -1

      - name: Verify bison version
        if: matrix.builder != 'alpine'
        run: bison --version | head -1

      - name: Configure & build (native)
        if: matrix.builder != 'alpine'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Universal2: pass -arch flags through CFLAGS+LDFLAGS.
            # Apple's clang builds fat .o files; the linker produces
            # a fat binary directly. min-version 11.0 is the highest
            # arm64 deployment target supported and works for x86_64
            # too (Big Sur+).
            export CFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O2"
            export LDFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=11.0"
            ./configure --quiet
            make -j$(sysctl -n hw.ncpu)
          else
            ./configure --quiet
            make -j$(nproc)
          fi
          ls -la bash

      # Build inside an alpine container so the resulting binary
      # links against musl libc — required for the desktop SPA's
      # c2w-net container (Alpine 3.19) and the WASM VM that ships
      # with it. Image cache lets the apk add complete in seconds
      # on subsequent runs.
      #
      # `touch configure aclocal.m4 configure.ac' nudges the
      # mtime ordering so autotools-generated Makefile rules don't
      # try to regenerate `configure' from `configure.ac' (which
      # would require autoconf — bash 5.3 ships a working
      # configure, no regeneration needed). Without this, fresh
      # checkout timestamps occasionally land in the wrong order
      # and `make' fails with `autoconf: not found'.
      - name: Configure & build (alpine/musl)
        if: matrix.builder == 'alpine'
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            --platform linux/amd64 \
            alpine:3.19 sh -c '
              set -e
              apk add --no-cache build-base bison
              touch aclocal.m4 configure.ac configure
              ./configure --quiet
              make -j$(nproc)
              ls -la bash
            '

      - name: Stage artifact
        run: |
          mkdir -p out
          cp bash "out/${{ matrix.artifact }}"
          chmod +x "out/${{ matrix.artifact }}"
          file "out/${{ matrix.artifact }}"
          # Universal2 sanity check: lipo should report both arches.
          if [ "$RUNNER_OS" = "macOS" ]; then
            archs=$(lipo -archs "out/${{ matrix.artifact }}")
            echo "lipo archs: ${archs}"
            case "${archs}" in
              *arm64*x86_64*|*x86_64*arm64*) echo "✓ universal2 confirmed" ;;
              *) echo "✗ expected universal2, got '${archs}'"; exit 1 ;;
            esac
          fi
          # Smoke tests. The musl build links against
          # /lib/ld-musl-x86_64.so.1 — only present in Alpine, so
          # run those tests inside the same alpine container we
          # built in. Native (glibc / Mach-O) artifacts run on the
          # host runner directly.
          if [ "${{ matrix.builder }}" = "alpine" ]; then
            docker run --rm \
              -v "$PWD/out":/out -w /out \
              --platform linux/amd64 \
              alpine:3.19 sh -c '
                "./${{ matrix.artifact }}" --version
                "./${{ matrix.artifact }}" -c "echo 1+1=\$((1+1)); for i in 1 2 3; do echo iter \$i; done"
              '
          else
            "./out/${{ matrix.artifact }}" --version
            "./out/${{ matrix.artifact }}" -c 'echo 1+1=$((1+1)); for i in 1 2 3; do echo iter $i; done'
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p assets
          find artifacts -type f -exec cp {} assets/ \;
          ls -la assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Auto-flag tags with PEP 440 pre-release suffixes (e.g.
          # v0.1.0a1, v0.1.0b2, v0.1.0rc1) as pre-releases. Stable
          # tags (v0.1.0, v1.0.0) get marked stable.
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
