name: Release

# Tagged release workflow. On any push to a `v*` tag (or a manual
# workflow_dispatch), build the bundled tai artifact for macOS
# universal2 and publish a GitHub Release with the asset attached.
# Tag PEP-440 pre-release suffixes (a / b / rc) get marked as
# pre-releases automatically.
#
# Architecture: single artifact, single platform.
#
#   * Mac universal2 (arm64 + x86_64) only — pyobjc and the SikuliX
#     bridge are macOS-specific, so the embedded-holo surface
#     doesn't make sense on Linux/Windows. Cross-platform plain
#     bash (without the embedded surface) would need a
#     `--without-embedded-holo` configure flag; deferred to the
#     `tai-slim` design doc item.
#
#   * One bundled binary, ~150 MB, all-inclusive. Drops the prior
#     workflow's separate plain-bash artifacts — the bundled binary
#     invoked under any non-tai argv[0] (e.g. `bash`, `sh`) is
#     indistinguishable from upstream bash + the `@` operator, so
#     the plain artifacts had no purchase the bundled doesn't
#     already cover.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # required for softprops/action-gh-release to upload assets

jobs:
  build:
    name: build (macOS universal2 bundled)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/cpython is a submodule with our pinned 3.13.13
          # source. Without `recursive` the embedded/Makefile cpython
          # target fails immediately.
          submodules: recursive

      # macOS GitHub runners ship Apple's ancient `bison 2.3` which
      # can't process bash 5.3's parse.y. Install Homebrew's modern
      # bison and put it at the front of PATH.
      - name: Install modern bison
        run: |
          brew install bison
          BISON_DIR="$(brew --prefix bison)/bin"
          echo "${BISON_DIR}" >> "$GITHUB_PATH"
          "${BISON_DIR}/bison" --version | head -1

      # actions/setup-python on macos-14 ships an arm64-only
      # interpreter — building universal2 wheels via delocate
      # requires that the HOST Python be universal2 so the
      # site-packages discovery iterates both arches consistently.
      # Use python.org's universal2 PKG installer (same approach
      # holo uses) and pin to 3.13.x to match the embedded CPython
      # ABI (cpython-313-darwin wheel tag is shared across all
      # 3.13.* patch versions, so minor mismatch is fine).
      - name: Install universal2 Python 3.13 from python.org
        run: |
          PY_VER=3.13.5
          curl -fsSL -o python-installer.pkg \
            "https://www.python.org/ftp/python/${PY_VER}/python-${PY_VER}-macos11.pkg"
          sudo installer -pkg python-installer.pkg -target /
          PY_BIN=/Library/Frameworks/Python.framework/Versions/3.13/bin
          echo "${PY_BIN}" >> "$GITHUB_PATH"
          echo "TAI_HOST_PYTHON=${PY_BIN}/python3" >> "$GITHUB_ENV"
          "${PY_BIN}/python3" --version
          file "${PY_BIN}/python3"

      # Pin OpenSSL version; bumping it busts both the OpenSSL and
      # CPython caches and forces a clean rebuild end-to-end.
      - name: Set OpenSSL version
        id: openssl_pin
        run: echo "version=3.4.0" >> "$GITHUB_OUTPUT"

      - name: Cache OpenSSL universal2 build
        id: openssl_cache
        uses: actions/cache@v4
        with:
          path: build/openssl-install
          key: openssl-universal2-${{ steps.openssl_pin.outputs.version }}-v1

      # Build OpenSSL universal2 by compiling for each arch into a
      # per-arch prefix, then lipo-ing the resulting static libs
      # (libssl.a, libcrypto.a) into a single universal2 install.
      # Headers come from the arm64 build (they're identical across
      # arches). Required because (a) Homebrew's openssl is single-
      # arch, (b) CPython's _ssl C extension links statically against
      # OpenSSL at CPython build time, and (c) without _ssl, anyio
      # (transitive dep of mcp) crashes on import.
      - name: Build OpenSSL universal2
        if: steps.openssl_cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ steps.openssl_pin.outputs.version }}"
          SRC=/tmp/openssl-src
          ARM_PFX=/tmp/openssl-arm64
          X86_PFX=/tmp/openssl-x86_64
          OUT="$PWD/build/openssl-install"

          rm -rf "$SRC" "$ARM_PFX" "$X86_PFX" "$OUT"
          mkdir -p "$SRC" "$OUT/lib" "$OUT/include"

          curl -fsSL -o /tmp/openssl.tar.gz \
            "https://www.openssl.org/source/openssl-${VER}.tar.gz"
          tar xzf /tmp/openssl.tar.gz -C "$SRC" --strip-components=1

          # arm64 slice
          (cd "$SRC" && \
            ./Configure darwin64-arm64-cc no-shared no-tests \
              --prefix="$ARM_PFX" \
              -mmacosx-version-min=11.0 && \
            make -j$(sysctl -n hw.ncpu) >/dev/null && \
            make install_sw >/dev/null && \
            make clean >/dev/null)

          # x86_64 slice
          (cd "$SRC" && \
            ./Configure darwin64-x86_64-cc no-shared no-tests \
              --prefix="$X86_PFX" \
              -mmacosx-version-min=11.0 && \
            make -j$(sysctl -n hw.ncpu) >/dev/null && \
            make install_sw >/dev/null)

          # Lipo the static libs together; headers from arm64 slice.
          cp -R "$ARM_PFX/include/." "$OUT/include/"
          for lib in libssl libcrypto; do
            lipo -create "$ARM_PFX/lib/${lib}.a" "$X86_PFX/lib/${lib}.a" \
                 -output "$OUT/lib/${lib}.a"
            archs=$(lipo -archs "$OUT/lib/${lib}.a")
            echo "$lib archs: ${archs}"
            case "${archs}" in
              *arm64*x86_64*|*x86_64*arm64*) echo "  ✓ universal2" ;;
              *) echo "  ✗ expected universal2, got '${archs}'"; exit 1 ;;
            esac
          done

      # Capture the CPython submodule sha for cache keying. Cache
      # key also includes the OpenSSL version so a OpenSSL bump
      # busts the CPython cache and forces a rebuild with the new
      # _ssl link.
      - name: Compute CPython submodule sha
        id: cpython_sha
        run: echo "sha=$(git -C third_party/cpython rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache CPython static build
        id: cpython_cache
        uses: actions/cache@v4
        with:
          path: build/cpython-install
          # -v2 (was -v1): bump on CPYTHON_CONFIGURE_FLAGS changes
          # in embedded/Makefile. Including the OpenSSL version
          # too because _ssl is linked against it.
          key: cpython-static-universal2-${{ steps.cpython_sha.outputs.sha }}-openssl-${{ steps.openssl_pin.outputs.version }}-v2

      - name: Build static CPython 3.13 (universal2 + _ssl)
        if: steps.cpython_cache.outputs.cache-hit != 'true'
        env:
          TAI_UNIVERSAL2: "1"
        run: |
          export TAI_OPENSSL_PREFIX="$PWD/build/openssl-install"
          make -C embedded cpython
          # Sanity: libpython3.13.a should be universal2.
          archs=$(lipo -archs build/cpython-install/lib/libpython3.13.a)
          echo "libpython3.13.a archs: ${archs}"
          case "${archs}" in
            *arm64*x86_64*|*x86_64*arm64*) echo "✓ universal2 confirmed" ;;
            *) echo "✗ expected universal2 libpython, got '${archs}'"; exit 1 ;;
          esac
          # Sanity: _ssl module should have been built and be
          # universal2. Path depends on whether CPython produces a
          # framework-style install; check the standard locations.
          ssl_so=$(find build/cpython-install -name "_ssl*.so" -type f | head -1)
          if [ -z "$ssl_so" ]; then
            echo "✗ _ssl module missing from cpython-install"
            exit 1
          fi
          archs=$(lipo -archs "$ssl_so")
          echo "$(basename "$ssl_so") archs: ${archs}"
          case "${archs}" in
            *arm64*x86_64*|*x86_64*arm64*) echo "✓ _ssl universal2 confirmed" ;;
            *) echo "✗ expected universal2 _ssl, got '${archs}'"; exit 1 ;;
          esac

      - name: Install pip deps into build/site-packages
        run: make -C embedded deps HOST_PYTHON="${TAI_HOST_PYTHON}"

      # Make every .so under build/site-packages universal2. Same
      # algorithm as holo's release workflow: for each single-arch
      # offender, try to swap in a pure-Python wheel (websockets
      # ships one alongside its arm64 wheel), and if that's not
      # available, fuse the arm64+x86_64 wheels via
      # delocate-merge (delocate 0.13+). Required for pyobjc-
      # framework-* and pydantic-core, both of which carry
      # compiled extensions.
      - name: Fuse single-arch native extensions to universal2
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          # PYTHONPATH so importlib.metadata picks up our build dir.
          export PYTHONPATH="$PWD/build/site-packages:${PYTHONPATH:-}"
          "${TAI_HOST_PYTHON}" -m pip install --upgrade delocate
          mkdir -p /tmp/wheels

          "${TAI_HOST_PYTHON}" > /tmp/bad_pkgs.txt <<'PY'
          import os, subprocess
          from importlib.metadata import distributions

          bad = {}
          for dist in distributions():
              name = dist.metadata["Name"]
              version = dist.version
              for f in (dist.files or []):
                  fs = str(f)
                  if not fs.endswith(".so"):
                      continue
                  parts = fs.replace("\\", "/").split("/")
                  if any(p in ("tests", "test") for p in parts):
                      continue
                  full = str(dist.locate_file(f))
                  if not os.path.exists(full):
                      continue
                  try:
                      archs = subprocess.check_output(
                          ["lipo", "-archs", full],
                          stderr=subprocess.DEVNULL,
                      ).decode().strip()
                  except subprocess.CalledProcessError:
                      continue
                  if not ("arm64" in archs and "x86_64" in archs):
                      bad[name] = version
                      break
          for n, v in sorted(bad.items()):
              print(f"{n}=={v}")
          PY

          echo "::group::offenders"
          cat /tmp/bad_pkgs.txt
          echo "::endgroup::"

          # Install a wheel by unpacking into a fresh staging dir, then
          # replacing each top-level entry in build/site-packages. Plain
          # `pip install --target X --force-reinstall <whl>` does NOT
          # overwrite existing files in X reliably (known pip-with-
          # --target quirk), so we have to walk the wheel's top-level
          # entries ourselves and `rm -rf` each before copying. Also
          # handles the pure-Python-replacing-arch-specific case
          # (websockets: pure wheel doesn't ship speedups.so, so the
          # stale single-arch speedups.so needs to vanish too).
          install_wheel_overlay() {
            local whl=$1
            local slug=$2
            local stage="/tmp/fuse-install-${slug}"
            rm -rf "$stage"
            "${TAI_HOST_PYTHON}" -m pip install --no-deps --target "$stage" "$whl"
            for entry in "$stage"/*; do
              local name
              name=$(basename "$entry")
              rm -rf "build/site-packages/${name}"
              cp -R "$entry" "build/site-packages/${name}"
            done
          }

          fuse_pkg() {
            local spec=$1
            local pkg_name=${spec%%==*}
            local slug=${spec//[^A-Za-z0-9]/_}
            local arm_dir="/tmp/wheels/${slug}-arm64"
            local x86_dir="/tmp/wheels/${slug}-x86"
            local out_dir="/tmp/wheels/${slug}-out"
            rm -rf "$arm_dir" "$x86_dir" "$out_dir"
            mkdir -p "$arm_dir" "$x86_dir" "$out_dir"

            # Pure-Python wheel first (websockets path).
            if "${TAI_HOST_PYTHON}" -m pip download --no-deps --only-binary=:all: \
                 --platform any --python-version 3.13 \
                 --dest "$out_dir" "$spec" >/dev/null 2>&1; then
              local pure_whl
              pure_whl=$(ls "$out_dir"/*-py3-none-any.whl 2>/dev/null \
                         || ls "$out_dir"/*-py2.py3-none-any.whl 2>/dev/null \
                         || true)
              if [ -n "$pure_whl" ]; then
                echo "  → pure-Python: $(basename "$pure_whl")"
                install_wheel_overlay "$pure_whl" "${slug}-pure"
                return 0
              fi
            fi

            # Fuse arm64+x86_64 wheels via delocate-merge. If x86_64
            # has no wheel at the pinned version (cffi 2.0.0 etc),
            # fall back to whatever version still has both arches.
            rm -rf "$out_dir"; mkdir -p "$out_dir"
            if ! "${TAI_HOST_PYTHON}" -m pip download --no-deps --only-binary=:all: \
                   --platform macosx_10_12_x86_64 --python-version 3.13 \
                   --dest "$x86_dir" "$spec" 2>/dev/null; then
              echo "  ! no x86_64 wheel for $spec — falling back to latest"
              rm -rf "$x86_dir"; mkdir -p "$x86_dir"
              "${TAI_HOST_PYTHON}" -m pip download --no-deps --only-binary=:all: \
                --platform macosx_10_12_x86_64 --python-version 3.13 \
                --dest "$x86_dir" "$pkg_name"
            fi
            local x86_whl fuse_version
            x86_whl=$(ls "$x86_dir"/*.whl)
            fuse_version=$(basename "$x86_whl" | awk -F- '{print $2}')
            "${TAI_HOST_PYTHON}" -m pip download --no-deps --only-binary=:all: \
              --platform macosx_11_0_arm64 --python-version 3.13 \
              --dest "$arm_dir" "${pkg_name}==${fuse_version}"
            local arm_whl fused_whl
            arm_whl=$(ls "$arm_dir"/*.whl)
            "${TAI_HOST_PYTHON}" -m delocate.cmd.delocate_merge "$arm_whl" "$x86_whl" -w "$out_dir"
            fused_whl=$(ls "$out_dir"/*.whl)
            echo "  → fused: $(basename "$fused_whl") (version $fuse_version)"
            install_wheel_overlay "$fused_whl" "${slug}-fused"
          }

          while read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "::group::fuse $pkg"
            fuse_pkg "$pkg"
            echo "::endgroup::"
          done < /tmp/bad_pkgs.txt

          # Final verification scan.
          echo "::group::verify universal2"
          "${TAI_HOST_PYTHON}" <<'PY'
          import os, subprocess, sys
          from importlib.metadata import distributions

          bad = []
          for dist in distributions():
              for f in (dist.files or []):
                  fs = str(f)
                  if not fs.endswith(".so"):
                      continue
                  parts = fs.replace("\\", "/").split("/")
                  if any(p in ("tests", "test") for p in parts):
                      continue
                  full = str(dist.locate_file(f))
                  if not os.path.exists(full):
                      continue
                  try:
                      archs = subprocess.check_output(
                          ["lipo", "-archs", full],
                          stderr=subprocess.DEVNULL,
                      ).decode().strip()
                  except subprocess.CalledProcessError:
                      continue
                  if "arm64" in archs and "x86_64" in archs:
                      print(f"OK {full} ({archs})")
                  else:
                      bad.append((full, archs))
                      print(f"BAD {full} ({archs})")
          if bad:
              print(f"\n{len(bad)} single-arch .so still present", file=sys.stderr)
              sys.exit(1)
          PY
          echo "::endgroup::"

      - name: Download SikuliX jar
        run: make -C embedded sikuli-jar

      # Top-level bash build: pass -arch flags so the linker
      # produces a universal2 Mach-O. libpython3.13.a built above
      # is universal2, the EMBED_LIBS link line picks it up.
      - name: Configure & build bash (universal2)
        run: |
          # Force regen of bison output (mirrors the comment in the
          # prior workflow about untracked y.tab.c).
          rm -f y.tab.c y.tab.h
          export CFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O2"
          export LDFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=11.0"
          ./configure --quiet
          make -j$(sysctl -n hw.ncpu)
          archs=$(lipo -archs bash)
          echo "bash archs: ${archs}"
          case "${archs}" in
            *arm64*x86_64*|*x86_64*arm64*) echo "✓ universal2 bash confirmed" ;;
            *) echo "✗ expected universal2 bash, got '${archs}'"; exit 1 ;;
          esac

      - name: Append payload + trailer (make bundle)
        run: make -C embedded bundle

      # Mach-O code signature is invalidated by the appended payload,
      # so the binary needs to be (re)signed AFTER the bundle step.
      # Adhoc signature (--sign -) covers all bytes of the file
      # including the appended tarball + trailer, so Gatekeeper
      # accepts the artifact on Macs without an explicit quarantine
      # opt-out. Mirrors holo's `Re-sign binary (macOS adhoc)` step.
      # No post-bundle codesign. Clang's default ad-hoc signature
      # on the arm64 slice (required for arm64 to load at all) is
      # left intact: our append only adds bytes AFTER the Mach-O
      # segments, outside the signed region, so the signature
      # stays valid for loading. We tried three resign variants
      # in this branch's history and each broke the payload
      # (codesign --remove-signature truncates; codesign --force
      # without --remove-signature fails internal validation on
      # the existing signature because the file has trailing
      # bytes). Without a Developer ID (out of scope per the
      # design doc), additional codesign doesn't change the
      # Gatekeeper outcome on the user side — they still have to
      # clear com.apple.quarantine on a downloaded artifact.
      # PyInstaller --onefile takes the same approach.
      - name: Verify the bundled binary loads (no resign needed)
        run: |
          # `codesign --display` shows the existing signature so we
          # can confirm the arm64 slice is still adhoc-signed after
          # the append step.
          codesign --display --verbose=2 build/tai-bundled || true
          # Filesystem size sanity: bundle should be ~150 MB
          # (bash ~7 MB + tarball ~143 MB + 24 B trailer).
          stat -f "%z bytes" build/tai-bundled

      - name: Verify universal2 + smoke test the bundled binary
        run: |
          archs=$(lipo -archs build/tai-bundled)
          echo "tai-bundled archs: ${archs}"
          case "${archs}" in
            *arm64*x86_64*|*x86_64*arm64*) echo "✓ universal2 confirmed" ;;
            *) echo "✗ expected universal2, got '${archs}'"; exit 1 ;;
          esac

          # Drive an MCP initialize+tools/list against the freshly-
          # built binary invoked under the tcsh name. Counts 25
          # tools — the design-doc surface.
          ln -sf "$PWD/build/tai-bundled" /tmp/tcsh
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0.1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | /tmp/tcsh > /tmp/ci-out.jsonl 2> /tmp/ci-stderr.log || true
          echo "::group::smoke stderr"
          cat /tmp/ci-stderr.log
          echo "::endgroup::"
          "${TAI_HOST_PYTHON}" - <<'PY'
          import json, sys
          tools = None
          with open("/tmp/ci-out.jsonl") as f:
              for line in f:
                  if not line.strip().startswith("{"):
                      continue
                  msg = json.loads(line)
                  if msg.get("id") == 2:
                      tools = msg["result"]["tools"]
          if tools is None:
              print("FAIL: no tools/list response", file=sys.stderr)
              sys.exit(1)
          names = sorted(t["name"] for t in tools)
          print(f"tools: {len(tools)}")
          # Sanity-check the surface: every expected family member
          # must be present. Counts can grow (e.g. `doctor` added
          # in #22 → 26); use a name-based check so the assertion
          # isn't brittle to additions.
          required_prefixes = ("browser_", "screen_", "ui_template_")
          required_exact = {"app_activate", "doctor", "holo"}  # holo not registered as a tool
          missing = []
          for prefix in required_prefixes:
              if not any(n.startswith(prefix) for n in names):
                  missing.append(f"no {prefix}* tools")
          for exact in {"app_activate", "doctor"}:
              if exact not in names:
                  missing.append(f"missing tool: {exact}")
          if missing:
              print("FAIL: " + "; ".join(missing), file=sys.stderr)
              print(f"  registered: {names}", file=sys.stderr)
              sys.exit(1)
          if len(tools) < 25:
              print(f"FAIL: only {len(tools)} tools, expected >=25",
                    file=sys.stderr)
              sys.exit(1)
          PY

      - name: Stage release artifact
        run: |
          mkdir -p out
          cp build/tai-bundled out/tai-bundled-macos-universal2
          chmod +x out/tai-bundled-macos-universal2
          ls -la out/
          shasum -a 256 out/tai-bundled-macos-universal2 \
            > out/tai-bundled-macos-universal2.sha256
          cat out/tai-bundled-macos-universal2.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tai-bundled-macos-universal2
          path: |
            out/tai-bundled-macos-universal2
            out/tai-bundled-macos-universal2.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p assets
          find artifacts -type f -exec cp {} assets/ \;
          ls -la assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Auto-flag tags with PEP 440 pre-release suffixes (e.g.
          # v0.1.0a1, v0.1.0b2, v0.1.0rc1) as pre-releases. Stable
          # tags (v0.1.0, v1.0.0) get marked stable.
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
